name: Deploy florence-crm-api

# Deploys the Cloudflare Worker whenever its source changes on main.
# Runs on GitHub's runners (no network egress limits), so it works even when a
# local/cloud session can't reach api.cloudflare.com.
#
# Required repo secret: CLOUDFLARE_API_TOKEN  (Settings → Secrets and variables
# → Actions). The account ID lives in wrangler.toml (not secret).

on:
  push:
    branches: [main]
    paths:
      - 'worker/florence-crm-api/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker/florence-crm-api
