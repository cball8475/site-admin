name: Deploy florence-dashboard-proxy

# Serves dashboard.florencescservices.com (behind Cloudflare Access) and
# injects the CRM bearer for /api/*, /engine/*, /outreach/*.
# Mirrors deploy-worker.yml. Required repo secret: CLOUDFLARE_API_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'worker/florence-dashboard-proxy/**'
      - '.github/workflows/deploy-dashboard-proxy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker/florence-dashboard-proxy
