name: Setup R2 bucket + Vectorize index (one-time)

# One-time provisioning for d1-backup and kb-search, run from GitHub's runners
# so no local wrangler is needed. Idempotent — safe to re-run.
#
# PREREQUISITE: enable R2 once in the Cloudflare dashboard (R2 -> Enable).
# The bucket-create step will fail with a clear message until you do.
#
# Required repo secret: CLOUDFLARE_API_TOKEN with R2 + Vectorize edit permissions.

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Install wrangler
        run: npm i -g wrangler
      # "|| echo" would mask the difference between "already exists" (fine) and
      # "R2 was never enabled" (every nightly backup fails from day one). Only
      # the already-exists case is allowed to pass.
      - name: Create R2 bucket d1-backups (idempotent)
        run: |
          set +e
          out=$(wrangler r2 bucket create d1-backups 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qi "already exists"; then
            echo "::error::R2 bucket create failed for a reason other than 'already exists' — likely R2 is not enabled on the account. d1-backup CANNOT write snapshots until this is fixed."
            exit 1
          fi
      - name: Create Vectorize index eaton-kb (idempotent)
        run: |
          set +e
          out=$(wrangler vectorize create eaton-kb --dimensions=768 --metric=cosine 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qi "already exists"; then
            echo "::error::Vectorize index create failed for a reason other than 'already exists'."
            exit 1
          fi
