name: Deploy florence-outreach

# Secured Claude copy-gen proxy. Mirrors deploy-worker.yml.
# Required repo secret: CLOUDFLARE_API_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'worker/florence-outreach/**'
      - '.github/workflows/deploy-florence-outreach.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker/florence-outreach
      - name: Verify auth is enforced (expect 401 without a token)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}' \
            https://florence-outreach.cball8475.workers.dev)
          echo "unauthenticated POST → $code"
          test "$code" = "401"
