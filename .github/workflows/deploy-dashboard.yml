name: Deploy dashboard (Cloudflare Pages)

# Builds the React app and uploads it to the florence-dashboard Pages project
# (direct-upload; the site is served through florence-dashboard-proxy behind
# Cloudflare Access). Required repo secret: CLOUDFLARE_API_TOKEN — the token
# needs Pages:Edit permission for this step; if it lacks it, deploy the
# dashboard from a local/remote session with `npm run build && npx wrangler
# pages deploy dist --project-name=florence-dashboard`.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --branch=main = the Pages production environment; without it a
        # non-main checkout would publish an invisible preview deployment.
        run: npx wrangler pages deploy dist --project-name=florence-dashboard --branch=main --commit-dirty=true
